            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Zigbee/Lights/ZigbeeHaOnOffPorchLight
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install compiler dependency
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Register isolated local core
        run: |
          mkdir -p "${HOME}/Arduino/hardware/localnrf54"
          ln -sfn "${GITHUB_WORKSPACE}/hardware/nrf54l15clean/nrf54l15clean" \
            "${HOME}/Arduino/hardware/localnrf54/nrf54l15clean"

      - name: Compile audit contract
        run: |
          set -o pipefail
          build_log="${RUNNER_TEMP}/audit-contract-build.log"
          arduino-cli compile \
            --warnings all \
            --fqbn "localnrf54:nrf54l15clean:${{ matrix.board }}:${{ matrix.options }}" \
            "${GITHUB_WORKSPACE}/${{ matrix.sketch }}" 2>&1 | tee "${build_log}"
          if grep -Fq "warning:" "${build_log}"; then
            echo "Compiler warnings are not allowed in audit-contract builds."
            grep -F "warning:" "${build_log}"
            exit 1
          fi

  zigbee-strict-capacity-compiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xiao_nrf54l15
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Zigbee/Coordinator/ZigbeeHaCoordinatorJoinDemo
          - board: xiao_nrf54lm20b
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Zigbee/Lights/ZigbeeHaOnOffPorchLight
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install compiler dependency
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Register isolated local core
        run: |
          mkdir -p "${HOME}/Arduino/hardware/localnrf54"
          ln -sfn "${GITHUB_WORKSPACE}/hardware/nrf54l15clean/nrf54l15clean" \
            "${HOME}/Arduino/hardware/localnrf54/nrf54l15clean"

      - name: Compile with explicit output capacities required
        run: |
          set -o pipefail
          build_log="${RUNNER_TEMP}/zigbee-strict-capacity.log"
          arduino-cli compile \
            --warnings all \
            --fqbn "localnrf54:nrf54l15clean:${{ matrix.board }}:clean_zigbee=on,clean_ble=off" \
            --build-property "build.zigbee_flags=-DNRF54L15_CLEAN_ZIGBEE_ENABLED=1 -DNRF54L15_CLEAN_ZIGBEE_REQUIRE_EXPLICIT_OUTPUT_CAPACITY=1" \
            "${GITHUB_WORKSPACE}/${{ matrix.sketch }}" 2>&1 | tee "${build_log}"
          if grep -Fq "warning:" "${build_log}"; then
            echo "Compiler warnings are not allowed in strict Zigbee builds."
            grep -F "warning:" "${build_log}"
            exit 1
          fi

  windows-native-tooling:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install compiler dependency
        shell: powershell
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Register isolated local core
        shell: powershell
        run: |
          arduino-cli config set directories.user "$env:RUNNER_TEMP/Arduino"
          $hardware = Join-Path $env:RUNNER_TEMP "Arduino/hardware/localnrf54/nrf54l15clean"
          New-Item -ItemType Directory -Path $hardware -Force | Out-Null
          Copy-Item -Path "hardware/nrf54l15clean/nrf54l15clean/*" -Destination $hardware -Recurse -Force

      - name: Compile through native Windows UF2 recipe
        shell: powershell
        run: |
          arduino-cli compile `
            --fqbn "localnrf54:nrf54l15clean:xiao_nrf54l15" `
            --build-path "$env:RUNNER_TEMP/nrf54-windows-build" `
            "hardware/nrf54l15clean/nrf54l15clean/examples/Basics/CoreVersionProbe"
          $uf2 = Get-Item "$env:RUNNER_TEMP/nrf54-windows-build/*.uf2"
          if ($uf2.Length -le 0) { throw "Windows compile did not emit UF2" }

      - name: Test Windows native tools
        shell: powershell
        run: ./tests/windows_native_tools.ps1

  package-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install compiler dependency
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Select package verification mode
        id: package-mode
        shell: bash
        run: |
          SOURCE_VERSION="nrf54l15clean"
          VERSION="$(sed -n 's/^version=//p' "hardware/nrf54l15clean/${SOURCE_VERSION}/platform.txt" | head -n1)"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "released=true" >> "${GITHUB_OUTPUT}"
          else
            echo "released=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify immutable published package
        if: steps.package-mode.outputs.released == 'true'
        run: |
          python3 ./scripts/verify_public_release.py \
            --index package_nrf54l15clean_index.json \
            --version "${{ steps.package-mode.outputs.version }}" \
            --include-tools \
            --retries 3 \
            --retry-delay 2

      - name: Build release artifacts
        if: steps.package-mode.outputs.released != 'true'
        run: |
          if [ -d "hardware/nrf54l15clean/nrf54l15clean" ]; then
            SOURCE_VERSION="nrf54l15clean"
          else
            SOURCE_VERSION="$(ls -1 hardware/nrf54l15clean | sort -V | tail -n1)"
          fi
          VERSION="$(sed -n 's/^version=//p' "hardware/nrf54l15clean/${SOURCE_VERSION}/platform.txt" | head -n1)"
          test -n "${VERSION}"
          ./scripts/build_release.py \
            --version "${VERSION}" \
            --source-version "${SOURCE_VERSION}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v{version}" \
            --reuse-existing-hosttools

      - name: Ensure checked-in index matches generated index
        if: steps.package-mode.outputs.released != 'true'
        run: |
          diff -u dist/package_nrf54l15clean_index.json package_nrf54l15clean_index.json
          diff -u dist/package_nrf54l15clean_stable_index.json package_nrf54l15clean_stable_index.json
          diff -u dist/package_nrf54l15clean_archive_index.json package_nrf54l15clean_archive_index.json

      - name: Verify checksum and size
        if: steps.package-mode.outputs.released != 'true'
        run: |
          PLATFORM_ARCHIVE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(manifest['platform']['archivePath'])
          PY
          )"
          VERSION="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(manifest['version'])
          PY
          )"
          INDEX_LIST="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(*manifest['indexes']['artifact'], sep='\n')
          PY
          )"
          test -n "${INDEX_LIST}"
          mapfile -t INDEXES <<< "${INDEX_LIST}"
          for INDEX in "${INDEXES[@]}"; do
            python3 ./scripts/verify_package_index.py \
              --index "${INDEX}" \
              --archive "${PLATFORM_ARCHIVE}" \
              --version "${VERSION}"
          done

      - name: Compile advertised features from exact archive
        if: steps.package-mode.outputs.released != 'true'
        run: |
          PLATFORM_ARCHIVE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(manifest['platform']['archivePath'])
          PY
          )"
          python3 ./scripts/verify_release_archive.py --archive "${PLATFORM_ARCHIVE}"
