    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install toolchain dependency
        run: |
          arduino-cli core update-index
          # Install a standard ARM platform to provision arm-none-eabi-gcc.
          arduino-cli core install arduino:mbed_nano

      - name: Register local clean core
        run: |
          mkdir -p "${HOME}/Arduino/hardware/localnrf54"
          ln -sfn "${GITHUB_WORKSPACE}/hardware/nrf54l15clean/nrf54l15clean" \
            "${HOME}/Arduino/hardware/localnrf54/nrf54l15clean"
          arduino-cli board details --fqbn "localnrf54:nrf54l15clean:xiao_nrf54l15" | \
            grep -F "localnrf54:nrf54l15clean:xiao_nrf54l15"

      - name: Compile ${{ matrix.sketch }}
        run: |
          arduino-cli compile \
            --fqbn "localnrf54:nrf54l15clean:xiao_nrf54l15:${{ matrix.options }}" \
            "${GITHUB_WORKSPACE}/${{ matrix.sketch }}"

  thread-matter-cross-board:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install toolchain dependency
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Compile checkout-pinned Thread and Matter board matrix
        run: python3 ./scripts/test_thread_matter_compile_matrix.py

  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Core I/O sanitizer and vector contracts
        run: python3 ./scripts/test_core_io_regressions.py

      - name: Zigbee codec and authenticated-security regressions
        run: python3 ./scripts/test_zigbee_codec_security_regressions.py

      - name: Zigbee output-capacity and atomicity contracts
        run: python3 ./scripts/test_zigbee_codec_capacity_contracts.py

      - name: Zigbee plaintext rejection and frame-counter hardening
        run: python3 ./scripts/test_zigbee_security_hardening.py

      - name: Zigbee compile-time feature-gate contracts
        run: python3 ./scripts/test_zigbee_feature_gate.py

      - name: Zigbee power-fail-safe persistence contracts
        run: python3 ./scripts/test_zigbee_persistence_journal.py

      - name: Zigbee Trust Center persistence and key contracts
        run: python3 ./scripts/test_zigbee_coordinator_security_contracts.py

      - name: Zigbee radio, clock, and silicon-errata contracts
        run: python3 ./scripts/test_zigbee_radio_hardware_contracts.py

      - name: Exclusive RADIO arbiter ownership contracts
        run: python3 ./scripts/test_exclusive_radio_arbiter_contracts.py

      - name: Zigbee hardware-validator result contracts
        run: python3 ./scripts/test_zigbee_validation_contracts.py

      - name: BLE background connection handoff contracts
        run: python3 ./scripts/test_ble_background_connection_handoff.py

      - name: BLE connection and encryption regression contracts
        run: python3 ./scripts/test_ble_connection_regression_contracts.py

      - name: BLE controller-state contracts
        run: python3 ./scripts/test_ble_controller_state.py

      - name: Wire scanner address-probe contracts
        run: python3 ./scripts/test_wire_address_probe_contracts.py

      - name: Bluefruit client, HID, signed-write, and DFU contracts
        run: python3 ./scripts/test_bluefruit_client_contracts.py

      - name: Bluefruit discovery and client lifetime contracts
        run: python3 ./scripts/test_bluefruit_discovery_lifetime_contracts.py

      - name: BLE directed-advertising contracts
        run: python3 ./scripts/test_ble_directed_advertising_contracts.py

      - name: BLE dynamic GATT authorization contracts
        run: python3 ./scripts/test_ble_gatt_authorization_contracts.py

      - name: BLE central indication contracts
        run: python3 ./scripts/test_ble_client_indication_contracts.py

      - name: BLE Service Changed contracts
        run: python3 ./scripts/test_service_changed_contracts.py

      - name: BLE Robust Caching contracts
        run: python3 ./scripts/test_ble_robust_caching_contracts.py

      - name: BLE security-policy and passkey contracts
        run: python3 ./scripts/test_ble_security_policy_contracts.py

      - name: BLE initialization and PMIC telemetry power regressions
        run: |
          python3 ./scripts/test_ble_lazy_security_init.py
          python3 ./scripts/test_ble_idle_power.py
          python3 ./scripts/test_npm1300_adc_power.py

      - name: BLE multi-bond persistence contracts
        run: python3 ./scripts/test_ble_multibond_contracts.py

      - name: BLE periodic-advertising truthfulness contracts
        run: python3 ./scripts/test_ble_periodic_advertising_contracts.py

      - name: Upload recovery and platform recipe contracts
        run: python3 ./scripts/test_upload_helper.py

      - name: Release version and prerelease contracts
        run: python3 ./scripts/test_release_versions.py

      - name: XIAO nRF54LM20A Sense PDM contracts
        run: python3 ./scripts/test_lm20a_pdm_contract.py

      - name: CRACEN IKG fail-closed contracts
        run: python3 ./scripts/test_cracen_ikg_contract.py

      - name: nRF54LM20A CRACEN RNG register contracts
        run: python3 ./scripts/test_lm20a_cracen_rng_header.py

      - name: Thread platform source and native contracts
        run: python3 ./scripts/test_thread_platform_contracts.py

      - name: Matter test-attestation contracts
        run: python3 ./scripts/test_matter_attestation.py

      - name: Matter System Layer contracts
        run: python3 ./scripts/test_matter_system_layer.py

      - name: Thread and Matter two-board runner parser contracts
        run: |
          python3 ./tests/thread_udp_soak_runner_test.py
          python3 ./tests/thread_meshcop_runner_test.py
          python3 ./tests/matter_inet_transport_runner_test.py

  audit-contract-compiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xiao_nrf54l15
            options: cpu_freq=64m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Diagnostics/HalRegisterContracts
          - board: xiao_nrf54lm20b
            options: cpu_freq=128m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Nrf54L15-Clean-Implementation/examples/Diagnostics/HalRegisterContracts
          - board: xiao_nrf54l15
            options: cpu_freq=64m
            sketch: hardware/nrf54l15clean/nrf54l15clean/examples/Power/SystemOffWakeDiag
          - board: xiao_nrf54lm20b
            options: cpu_freq=128m
            sketch: hardware/nrf54l15clean/nrf54l15clean/examples/Power/SystemOffWakeDiag
          - board: xiao_nrf54l15
            options: clean_ble=off
            sketch: hardware/nrf54l15clean/nrf54l15clean/examples/Wire/WireScanner
          - board: xiao_nrf54lm20b
            options: clean_ble=off
            sketch: hardware/nrf54l15clean/nrf54l15clean/examples/Wire/WireScanner
          - board: nrf54l15dk_pca10156
            options: clean_serial=header
            sketch: hardware/nrf54l15clean/nrf54l15clean/examples/Serial/SerialDualBaudRemapProbe
          - board: xiao_nrf54l15
            options: cpu_freq=64m
            sketch: hardware/nrf54l15clean/nrf54l15clean/libraries/Bluefruit52Lib/examples/HID/blehid_mouse
          - board: xiao_nrf54lm20b
