name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2

      - name: Install compiler dependency
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano

      - name: Derive version from tag
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          NOTES="docs/RELEASE_${VERSION}.md"
          test -f "${NOTES}"
          echo "notes=${NOTES}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify tag matches tracked source version
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          platform = Path("hardware/nrf54l15clean/nrf54l15clean")
          platform_version = next(
              line.split("=", 1)[1]
              for line in (platform / "platform.txt").read_text().splitlines()
              if line.startswith("version=")
          )
          if platform_version != version:
              raise SystemExit(
                  f"tag version {version!r} != tracked platform version "
                  f"{platform_version!r}"
              )
          for header in sorted((platform / "cores").glob("*/CoreVersionGenerated.h")):
              match = re.search(
                  r'^#define ARDUINO_NRF54L15_CLEAN_VERSION_STRING "([^"]+)"$',
                  header.read_text(),
                  flags=re.MULTILINE,
              )
              if match is None or match.group(1) != version:
                  actual = match.group(1) if match is not None else "<missing>"
                  raise SystemExit(
                      f"tag version {version!r} != {header} version {actual!r}"
                  )
          PY

      - name: Reset dist
        run: |
          rm -rf dist
          mkdir -p dist

      - name: Run release contract suites
        run: |
          python3 ./scripts/test_core_io_regressions.py
          python3 ./scripts/test_bluefruit_client_contracts.py
          python3 ./scripts/test_bluefruit_discovery_lifetime_contracts.py
          python3 ./scripts/test_ble_directed_advertising_contracts.py
          python3 ./scripts/test_ble_gatt_authorization_contracts.py
          python3 ./scripts/test_ble_client_indication_contracts.py
          python3 ./scripts/test_service_changed_contracts.py
          python3 ./scripts/test_ble_robust_caching_contracts.py
          python3 ./scripts/test_ble_security_policy_contracts.py
          python3 ./scripts/test_ble_lazy_security_init.py
          python3 ./scripts/test_ble_idle_power.py
          python3 ./scripts/test_npm1300_adc_power.py
          python3 ./scripts/test_ble_multibond_contracts.py
          python3 ./scripts/test_ble_periodic_advertising_contracts.py
          python3 ./scripts/test_upload_helper.py
          python3 ./scripts/test_release_versions.py
          python3 ./scripts/test_lm20a_pdm_contract.py
          python3 ./scripts/test_cracen_ikg_contract.py
          python3 ./scripts/test_lm20a_cracen_rng_header.py

      - name: Build release artifacts
        run: |
          if [ -d "hardware/nrf54l15clean/nrf54l15clean" ]; then
            SOURCE_VERSION="nrf54l15clean"
          else
            SOURCE_VERSION="$(ls -1 hardware/nrf54l15clean | sort -V | tail -n1)"
          fi
          ./scripts/build_release.py \
            --version "${{ steps.vars.outputs.version }}" \
            --source-version "${SOURCE_VERSION}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v{version}" \
            --host-tools-release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/host-tools-v{host_tool_version}" \
            --reuse-existing-hosttools

      - name: Verify release build did not rewrite tracked version files
        run: |
          git diff --exit-code -- \
            hardware/nrf54l15clean/nrf54l15clean/platform.txt \
            hardware/nrf54l15clean/nrf54l15clean/cores/nrf54l15/CoreVersionGenerated.h \
            hardware/nrf54l15clean/nrf54l15clean/cores/nrf54lm20b/CoreVersionGenerated.h

      - name: Verify checksum and size
        run: |
          PLATFORM_ARCHIVE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(manifest['platform']['archivePath'])
          PY
          )"
          INDEX_LIST="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(*manifest['indexes']['artifact'], sep='\n')
          PY
          )"
          test -n "${INDEX_LIST}"
          mapfile -t INDEXES <<< "${INDEX_LIST}"
          for INDEX in "${INDEXES[@]}"; do
            python3 ./scripts/verify_package_index.py \
              --index "${INDEX}" \
              --archive "${PLATFORM_ARCHIVE}" \
              --version "${{ steps.vars.outputs.version }}"
          done

      - name: Compile advertised features from exact archive
        run: |
          PLATFORM_ARCHIVE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(manifest['platform']['archivePath'])
          PY
          )"
          python3 ./scripts/verify_release_archive.py --archive "${PLATFORM_ARCHIVE}"

      - name: Verify tracked package indexes match release build
        run: |
          diff -u package_nrf54l15clean_index.json dist/package_nrf54l15clean_index.json
          diff -u package_nrf54l15clean_stable_index.json dist/package_nrf54l15clean_stable_index.json
          diff -u package_nrf54l15clean_archive_index.json dist/package_nrf54l15clean_archive_index.json

      - name: Verify immutable host-tools release is public
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          HOST_TAG="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlsplit

          index = json.loads(
              Path("dist/package_nrf54l15clean_archive_index.json").read_text()
          )
          package = index["packages"][0]
          platform = next(
              item for item in package["platforms"] if item["version"] == os.environ["VERSION"]
          )
          dependency = next(
              item
              for item in platform["toolsDependencies"]
              if item["name"] == "nrf54l15hosttools"
          )
          tool = next(
              item
              for item in package["tools"]
              if item["name"] == dependency["name"]
              and item["version"] == dependency["version"]
          )
          tags = {
              PurePosixPath(urlsplit(system["url"]).path).parts[-2]
              for system in tool["systems"]
          }
          if len(tags) != 1:
              raise SystemExit(f"host tool URLs do not share one release tag: {tags}")
          print(tags.pop())
          PY
          )"
          test "$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${HOST_TAG}" \
            --jq '.immutable')" = "true"
          python3 ./scripts/verify_public_release.py \
            --index dist/package_nrf54l15clean_archive_index.json \
            --version "${{ steps.vars.outputs.version }}" \
            --include-tools \
            --tools-only \
            --retries 3 \
            --retry-delay 5

      - name: Detect an existing immutable release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if RESPONSE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1)"; then
            printf '%s\n' "${RESPONSE}" >existing-release.json
            python3 - <<'PY'
          import json

          release = json.load(open("existing-release.json", encoding="utf-8"))
          if not release.get("immutable", False):
              raise SystemExit("existing release is mutable; refusing to replace its assets")
          PY
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${RESPONSE}" == *"HTTP 404"* ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${RESPONSE}" >&2
            exit 1
          fi

      - name: Publish GitHub release assets
        if: steps.existing_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: ${{ steps.vars.outputs.prerelease }}
          make_latest: false
          files: |
            dist/*
          body_path: ${{ steps.vars.outputs.notes }}
          generate_release_notes: true

      - name: Verify draft release assets before publication
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          gh release download "${GITHUB_REF_NAME}" --dir "${VERIFY_DIR}"
          python3 - "${VERIFY_DIR}" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          expected_dir = Path("dist")
          actual_dir = Path(sys.argv[1])
          expected = {path.name: path for path in expected_dir.iterdir() if path.is_file()}
          actual = {path.name: path for path in actual_dir.iterdir() if path.is_file()}
          if expected.keys() != actual.keys():
              raise SystemExit(
                  "draft asset set mismatch: "
                  f"missing={sorted(expected.keys() - actual.keys())}, "
                  f"extra={sorted(actual.keys() - expected.keys())}"
              )
          for name, local_path in expected.items():
              remote_path = actual[name]
              local = local_path.read_bytes()
              remote = remote_path.read_bytes()
              if len(local) != len(remote):
                  raise SystemExit(f"draft asset size mismatch: {name}")
              if hashlib.sha256(local).digest() != hashlib.sha256(remote).digest():
                  raise SystemExit(f"draft asset SHA-256 mismatch: {name}")
              print(f"draft asset verified: {name}")
          PY

      - name: Publish verified draft release
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.vars.outputs.prerelease }}" == "true" ]]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          fi

      - name: Verify release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.immutable')" = "true"

      - name: Verify public release bytes
        run: |
          RELEASE_INDEX="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          print(manifest['indexes']['release'])
          PY
          )"
          python3 ./scripts/verify_public_release.py \
            --index "${RELEASE_INDEX}" \
            --version "${{ steps.vars.outputs.version }}" \
            --include-tools \
            --retries 12 \
            --retry-delay 10
